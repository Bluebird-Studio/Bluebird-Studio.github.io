name: Overnight game experiment checks
on:
  pull_request:
    branches: [main]
    paths: ['experiments/**', '.github/workflows/experiments-ci.yml']
  push:
    branches: [main]
    paths: ['experiments/**', '.github/workflows/experiments-ci.yml']
permissions:
  contents: read
jobs:
  static-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse game JS
        run: |
          node --check experiments/voxel-frontier/game.js
          node --check experiments/neon-streets/game.js
      - name: Verify both browser entrypoints
        run: node --test experiments/tests/*.test.mjs
