name: Real browser playability smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/**'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/**'
      - '.github/workflows/browser-smoke.yml'
permissions:
  contents: read
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Launch and exercise both games on desktop and mobile
        run: node experiments/tests/browser-smoke.mjs
      - name: Upload screenshots for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-browser-screenshots
          path: experiments/browser-artifacts/
          if-no-files-found: warn
          retention-days: 3
